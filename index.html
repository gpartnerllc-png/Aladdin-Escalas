<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ELDIN I.A ERP | Master Dashboard</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency-systems-filled/48/FFD700/security-configuration.png">
    <style>
        :root {
            --platinum-black: #050505;
            --deep-blue: #001F3F;
            --golden-orange: #FF8C00;
            --gold-glow: #FFD700;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 215, 0, 0.2);
            --danger: #ff4d4d;
            --success: #00FF7F;
        }

        body {
            background: radial-gradient(circle at top, var(--deep-blue), var(--platinum-black));
            color: #E0E0E0; font-family: 'Inter', sans-serif;
            margin: 0; min-height: 100vh;
        }

        .master-container { padding: 40px; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }

        .security-card {
            background: var(--glass); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 25px; padding: 25px;
            box-shadow: -15px 15px 30px rgba(0,0,0,0.5);
        }

        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }

        .user-node {
            background: linear-gradient(145deg, #0a0a0a, #151515);
            border-left: 5px solid var(--golden-orange);
            padding: 20px; border-radius: 12px; position: relative;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05); padding: 4px 8px;
            border-radius: 5px; font-size: 10px; margin-top: 10px; display: inline-block;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-action {
            background: linear-gradient(to right, var(--golden-orange), var(--gold-glow));
            border: none; padding: 12px 20px; border-radius: 8px;
            color: black; font-weight: 900; cursor: pointer; width: 100%;
            transition: 0.3s; margin-bottom: 10px;
        }

        .btn-print {
            background: transparent; border: 1px solid var(--gold-glow);
            color: var(--gold-glow); padding: 10px; width: 100%; border-radius: 8px;
            font-weight: bold; cursor: pointer;
        }

        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 15px; }
        
        .counter-group {
            display: flex; align-items: center; background: #222; 
            border-radius: 6px; padding: 2px; border: 1px solid #333;
        }

        .btn-math {
            background: transparent; border: none; color: white; 
            width: 25px; height: 25px; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-small { 
            background: #222; border: 1px solid #444; color: #ccc; 
            padding: 8px; font-size: 10px; cursor: pointer; border-radius: 6px; 
            text-transform: uppercase; font-weight: bold;
        }
        
        .reward-points { color: var(--gold-glow); font-weight: bold; font-size: 20px; }
        .cpf-tag { color: #666; font-family: monospace; font-size: 11px; }

        /* TABELA DE IMPRESSÃO (ESCONDIDA NO DASHBOARD) */
        #print-table-container { display: none; }

        @media print {
            body { background: white !important; color: black !important; }
            .master-container, aside, .security-card, .controls, .btn-math { display: none !important; }
            
            #print-table-container { 
                display: block !important; 
                padding: 20px;
            }
            
            table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 12px; }
            th { background-color: #f2f2f2; }
            .header-print { text-align: center; border-bottom: 2px solid black; padding-bottom: 10px; }
        }
    </style>
</head>
<body>

<!-- ESTRUTURA PARA IMPRESSÃO EM LISTA (A4) -->
<div id="print-table-container">
    <div class="header-print">
        <h2>ELDIN I.A. ERP - RELATÓRIO DE ENTREGAS (KPI)</h2>
        <p id="print-date"></p>
        <h3 id="print-total-global"></h3>
    </div>
    <table id="table-data">
        <thead>
            <tr>
                <th>COLABORADOR</th>
                <th>IDENTIFICAÇÃO (CPF)</th>
                <th>VALOR A RECEBER</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<div class="master-container">
    <aside class="security-card">
        <h1>ELDIN I.A.</h1>
        <div style="font-size: 11px; color: var(--gold-glow); margin-bottom: 25px;">SISTEMA DE PREMIAÇÃO</div>
        
        <nav>
            <button class="btn-action" onclick="addUser()">+ NOVO COLABORADOR</button>
            <button class="btn-print" onclick="window.print()">🖨️ RELATÓRIO EM LISTA (A4)</button>
            <div style="margin-top: 40px; font-size: 11px; color: #888;">
                ⭐ 10 Pontos = R$ 1,00 | ❌ Falta = -R$ 50,00
            </div>
        </nav>
    </aside>

    <main>
        <div class="security-card" style="margin-bottom: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 style="margin:0; font-size: 14px; color: #888;">CUSTO GLOBAL DE PRODUTIVIDADE</h2>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div id="stats-display" style="font-size: 48px; font-weight: 900; color: var(--golden-orange);">R$ 0,00</div>
                        <button class="btn-math" onclick="resetGlobal()" style="color:var(--danger);">🔄</button>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 12px; color: #666;">PONTUALIDADE MÉDIA</div>
                    <div id="media-kpi" class="reward-points" style="font-size: 32px;">0%</div>
                </div>
            </div>
        </div>

        <div class="user-grid" id="node-container"></div>
    </main>
</div>

<script>
    let colaboradores = [
        { nome: "Cristian Ribeiro", cpf: "342.***.***-54", folgaFixa: "QUARTA", domingoMes: "2º Domingo", atestados: 0, faltas: 0, pontos: 1500 },
        { nome: "Mikaele Nascimento", cpf: "040.***.***-02", folgaFixa: "SEXTA", domingoMes: "1º Domingo", atestados: 0, faltas: 0, pontos: 2800 }
    ];

    function renderSystem() {
        const container = document.getElementById('node-container');
        const tableBody = document.getElementById('table-body');
        let totalBônusSomado = 0;
        let somaPontualidade = 0;

        // Limpar visual e tabela de impressão
        container.innerHTML = "";
        tableBody.innerHTML = "";

        colaboradores.forEach((c, index) => {
            const valorBase = c.pontos / 10;
            const penalidadeFaltas = c.faltas * 50;
            const bônusCalculado = Math.max(0, valorBase - penalidadeFaltas);
            const assiduidade = Math.max(0, 100 - (c.faltas * 15));
            
            somaPontualidade += assiduidade;
            totalBônusSomado += bônusCalculado;

            // Renderiza Dashboard
            container.innerHTML += `
            <div class="user-node">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <strong style="color:var(--gold-glow); font-size: 15px;">${c.nome.toUpperCase()}</strong><br>
                        <span class="cpf-tag">${c.cpf}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="btn-math" onclick="adjustValue(${index}, -10)" style="background:#333; border-radius:4px;">-</button>
                        <div class="reward-points">R$ ${bônusCalculado.toFixed(2)}</div>
                        <button class="btn-math" onclick="adjustValue(${index}, 10)" style="background:#333; border-radius:4px;">+</button>
                    </div>
                </div>

                <div style="margin: 12px 0;">
                    <div style="font-size: 9px; color: #888; margin-bottom: 4px;">ASSIDUIDADE: ${assiduidade}%</div>
                    <div style="width: 100%; height: 3px; background: #333; border-radius: 2px;">
                        <div style="width: ${assiduidade}%; height: 100%; background: var(--success); box-shadow: 0 0 10px var(--success);"></div>
                    </div>
                </div>

                <div style="display: flex; gap: 8px;">
                    <div class="stat-badge">FOLGA: ${c.folgaFixa}</div>
                    <div class="stat-badge">DOMINGO: ${c.domingoMes}</div>
                </div>
                
                <div style="margin-top:15px; font-size: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="counter-group">
                        <button class="btn-math" onclick="adjustStat(${index}, 'atestados', -1)">-</button>
                        <span style="flex:1; text-align:center;">🏥 ${c.atestados}</span>
                        <button class="btn-math" onclick="adjustStat(${index}, 'atestados', 1)">+</button>
                    </div>
                    <div class="counter-group">
                        <button class="btn-math" onclick="adjustStat(${index}, 'faltas', -1)">-</button>
                        <span style="flex:1; text-align:center;">❌ ${c.faltas}</span>
                        <button class="btn-math" onclick="adjustStat(${index}, 'faltas', 1)">+</button>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-small" style="grid-column: span 2; border-color: var(--success); color: var(--success);" onclick="addKpi(${index})">⭐ CREDITAR ENTREGA</button>
                    <button class="btn-small" onclick="changeFolga(${index})">Folga</button>
                    <button class="btn-small" onclick="changeDomingo(${index})">Domingo</button>
                    <button class="btn-small" style="grid-column: span 2; color: var(--danger);" onclick="removeUser(${index})">REMOVER</button>
                </div>
            </div>`;

            // Alimenta Tabela de Impressão (Apenas Nome e Valor)
            tableBody.innerHTML += `
                <tr>
                    <td>${c.nome.toUpperCase()}</td>
                    <td>${c.cpf}</td>
                    <td><strong>R$ ${bônusCalculado.toFixed(2)}</strong></td>
                </tr>
            `;
        });

        const totalFinal = totalBônusSomado.toFixed(2);
        document.getElementById('stats-display').innerText = `R$ ${totalFinal}`;
        document.getElementById('print-total-global').innerText = `TOTAL DA FOLHA: R$ ${totalFinal}`;
        document.getElementById('media-kpi').innerText = `${(somaPontualidade / (colaboradores.length || 1)).toFixed(0)}%`;
        document.getElementById('print-date').innerText = `Gerado em: ${new Date().toLocaleDateString()} às ${new Date().toLocaleTimeString()}`;
    }

    function adjustValue(index, amount) {
        colaboradores[index].pontos = Math.max(0, colaboradores[index].pontos + amount);
        renderSystem();
    }

    function resetGlobal() { if(confirm("Zerar todos os pontos?")) { colaboradores.forEach(c => c.pontos = 0); renderSystem(); }}

    function addKpi(index) {
        const pts = prompt("Adicionar quantos pontos?", "100");
        if(pts && !isNaN(pts)) { colaboradores[index].pontos += parseInt(pts); renderSystem(); }
    }

    function adjustStat(index, field, value) {
        colaboradores[index][field] = Math.max(0, colaboradores[index][field] + value);
        renderSystem();
    }

    function addUser() {
        const n = prompt("Nome:");
        const c = prompt("CPF:");
        if(n && c) {
            colaboradores.push({ nome: n, cpf: c, folgaFixa: "A DEFINIR", domingoMes: "1º Domingo", atestados: 0, faltas: 0, pontos: 0 });
            renderSystem();
        }
    }

    function removeUser(index) {
        if(confirm(`Remover ${colaboradores[index].nome}?`)) { colaboradores.splice(index, 1); renderSystem(); }
    }

    function changeFolga(index) {
        const n = prompt("Nova Folga:", colaboradores[index].folgaFixa);
        if(n) { colaboradores[index].folgaFixa = n.toUpperCase(); renderSystem(); }
    }

    function changeDomingo(index) {
        const n = prompt("Novo Domingo:", colaboradores[index].domingoMes);
        if(n) { colaboradores[index].domingoMes = n; renderSystem(); }
    }

    renderSystem();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ELDIN I.A ERP | Ultimate Scale Control</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency-systems-filled/48/FFD700/security-configuration.png">
    <style>
        :root {
            --platinum-black: #050505;
            --deep-blue: #001F3F;
            --golden-orange: #FF8C00;
            --gold-glow: #FFD700;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 215, 0, 0.2);
            --danger: #ff4d4d;
            --success: #00FF7F;
        }

        body {
            background: radial-gradient(circle at top, var(--deep-blue), var(--platinum-black));
            color: #E0E0E0; font-family: 'Inter', sans-serif;
            margin: 0; min-height: 100vh;
        }

        .master-container { padding: 40px; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }

        .security-card {
            background: var(--glass); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 25px; padding: 25px;
            box-shadow: -15px 15px 30px rgba(0,0,0,0.5);
        }

        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }

        .user-node {
            background: linear-gradient(145deg, #0a0a0a, #151515);
            border-left: 5px solid var(--golden-orange);
            padding: 20px; border-radius: 12px; position: relative;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05); padding: 5px 10px;
            border-radius: 5px; font-size: 10px; margin-top: 10px; display: inline-block;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-action {
            background: linear-gradient(to right, var(--golden-orange), var(--gold-glow));
            border: none; padding: 12px 20px; border-radius: 8px;
            color: black; font-weight: 900; cursor: pointer; width: 100%;
            transition: 0.3s;
        }

        .btn-action:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 15px; }
        
        .counter-group {
            display: flex; align-items: center; background: #222; 
            border-radius: 6px; padding: 2px; border: 1px solid #333;
        }

        .btn-math {
            background: transparent; border: none; color: white; 
            width: 30px; height: 30px; cursor: pointer; font-size: 16px;
        }

        .btn-math:hover { color: var(--gold-glow); }

        .btn-small { 
            background: #222; border: 1px solid #444; color: #ccc; 
            padding: 8px; font-size: 10px; cursor: pointer; border-radius: 6px; 
            text-transform: uppercase; font-weight: bold;
        }
        
        .btn-small:hover { border-color: var(--gold-glow); background: #333; }
        
        .reward-points { color: var(--gold-glow); font-weight: bold; font-size: 20px; }
        .cpf-tag { color: #666; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

<div class="master-container">
    <aside class="security-card">
        <h1>ELDIN I.A.</h1>
        <div style="font-size: 11px; color: var(--gold-glow); margin-bottom: 25px; letter-spacing: 1px;">NÚCLEO DE ESCALA ATIVO</div>
        
        <nav>
            <button class="btn-action" onclick="addUser()">+ NOVO COLABORADOR</button>
            <div style="margin-top: 40px;">
                <p style="font-size: 14px; letter-spacing: 1px;"><strong>REGRAS DE ESCALA</strong></p>
                <ul style="font-size: 11px; color: #888; padding-left: 15px; line-height: 1.8;">
                    <li>Folga Fixa Semanal</li>
                    <li>Rodízio: 1 Domingo p/ Mês</li>
                    <li>Janela Semestral de Atestados</li>
                    <li>Cálculo Automático de Bônus</li>
                </ul>
            </div>
        </nav>
    </aside>

    <main>
        <div class="security-card" style="margin-bottom: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 style="margin:0; font-size: 14px; color: #888;">PERFORMANCE GLOBAL DO PROJETO</h2>
                    <div id="stats-display" style="font-size: 48px; font-weight: 900; color: var(--golden-orange);">R$ 0,00</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 12px; color: #666;">METAS ATINGIDAS</div>
                    <div class="reward-points" style="font-size: 32px;">88%</div>
                </div>
            </div>
        </div>

        <div class="user-grid" id="node-container"></div>
    </main>
</div>

<script>
    let colaboradores = [
        { 
            nome: "Cristian Ribeiro", 
            cpf: "342.***.***-54", 
            folgaFixa: "QUARTA", 
            domingoMes: "2º Domingo",
            atestados: 5,
            faltas: 0,
            pontos: 1500
        },
        { 
            nome: "Mikaele Nascimento", 
            cpf: "040.***.***-02", 
            folgaFixa: "SEXTA", 
            domingoMes: "1º Domingo",
            atestados: 2,
            faltas: 2,
            pontos: 2800
        }
    ];

    function renderSystem() {
        const container = document.getElementById('node-container');
        container.innerHTML = colaboradores.map((c, index) => `
            <div class="user-node">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <strong style="color:var(--gold-glow); font-size: 16px;">${c.nome.toUpperCase()}</strong><br>
                        <span class="cpf-tag">${c.cpf}</span>
                    </div>
                    <div class="reward-points">R$ ${(c.pontos/10).toFixed(2)}</div>
                </div>

                <div style="display: flex; gap: 8px;">
                    <div class="stat-badge">FOLGA: ${c.folgaFixa}</div>
                    <div class="stat-badge">DOMINGO: ${c.domingoMes}</div>
                </div>
                
                <div style="margin-top:20px; font-size: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="counter-group">
                        <button class="btn-math" onclick="adjustStat(${index}, 'atestados', -1)">-</button>
                        <span style="flex:1; text-align:center;">🏥 Atestados: <strong>${c.atestados}</strong></span>
                        <button class="btn-math" onclick="adjustStat(${index}, 'atestados', 1)">+</button>
                    </div>
                    <div class="counter-group">
                        <button class="btn-math" onclick="adjustStat(${index}, 'faltas', -1)">-</button>
                        <span style="flex:1; text-align:center;">❌ Faltas: <strong>${c.faltas}</strong></span>
                        <button class="btn-math" onclick="adjustStat(${index}, 'faltas', 1)">+</button>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-small" onclick="changeFolga(${index})">Trocar Folga</button>
                    <button class="btn-small" onclick="changeSunday(${index})">Trocar Domingo</button>
                    <button class="btn-small" style="grid-column: span 2; border-color: var(--danger); color: var(--danger);" onclick="removeUser(${index})">REMOVER COLABORADOR</button>
                </div>
            </div>
        `).join('');
    }

    function adjustStat(index, field, value) {
        colaboradores[index][field] = Math.max(0, colaboradores[index][field] + value);
        renderSystem();
    }

    function changeFolga(index) {
        const nova = prompt("Nova folga fixa semanal:", colaboradores[index].folgaFixa);
        if(nova) {
            colaboradores[index].folgaFixa = nova.toUpperCase();
            renderSystem();
        }
    }

    function changeSunday(index) {
        const domingos = ["1º Domingo", "2º Domingo", "3º Domingo", "4º Domingo"];
        let atual = domingos.indexOf(colaboradores[index].domingoMes);
        let proximo = (atual + 1) % domingos.length;
        colaboradores[index].domingoMes = domingos[proximo];
        renderSystem();
    }

    function addUser() {
        const nome = prompt("Nome Completo:");
        const cpf = prompt("CPF:");
        if(nome && cpf) {
            colaboradores.push({ 
                nome, cpf, 
                folgaFixa: "A DEFINIR", 
                domingoMes: "1º Domingo",
                atestados: 0, faltas: 0, pontos: 0 
            });
            renderSystem();
        }
    }

    function removeUser(index) {
        if(confirm(`Confirmar exclusão de ${colaboradores[index].nome} do sistema?`)) {
            colaboradores.splice(index, 1);
            renderSystem();
        }
    }

    renderSystem();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ELDIN I.A ERP | Master Dashboard</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency-systems-filled/48/FFD700/security-configuration.png">
    <style>
        :root {
            --platinum-black: #050505;
            --deep-blue: #001F3F;
            --golden-orange: #FF8C00;
            --gold-glow: #FFD700;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 215, 0, 0.2);
            --danger: #ff4d4d;
            --success: #00FF7F;
        }

        body {
            background: radial-gradient(circle at top, var(--deep-blue), var(--platinum-black));
            color: #E0E0E0; font-family: 'Inter', sans-serif;
            margin: 0; min-height: 100vh;
        }

        .master-container { padding: 40px; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }

        .security-card {
            background: var(--glass); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 25px; padding: 25px;
            box-shadow: -15px 15px 30px rgba(0,0,0,0.5);
        }

        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }

        .user-node {
            background: linear-gradient(145deg, #0a0a0a, #151515);
            border-left: 5px solid var(--golden-orange);
            padding: 20px; border-radius: 12px; position: relative;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05); padding: 5px 10px;
            border-radius: 5px; font-size: 10px; margin-top: 10px; display: inline-block;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-action {
            background: linear-gradient(to right, var(--golden-orange), var(--gold-glow));
            border: none; padding: 12px 20px; border-radius: 8px;
            color: black; font-weight: 900; cursor: pointer; width: 100%;
            transition: 0.3s; margin-bottom: 10px;
        }

        .btn-action:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .btn-print {
            background: transparent; border: 1px solid var(--gold-glow);
            color: var(--gold-glow); padding: 10px; width: 100%; border-radius: 8px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-print:hover { background: var(--gold-glow); color: black; }

        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 15px; }
        
        .counter-group {
            display: flex; align-items: center; background: #222; 
            border-radius: 6px; padding: 2px; border: 1px solid #333;
        }

        .btn-math {
            background: transparent; border: none; color: white; 
            width: 30px; height: 30px; cursor: pointer; font-size: 16px;
        }

        .btn-small { 
            background: #222; border: 1px solid #444; color: #ccc; 
            padding: 8px; font-size: 10px; cursor: pointer; border-radius: 6px; 
            text-transform: uppercase; font-weight: bold;
        }
        
        .reward-points { color: var(--gold-glow); font-weight: bold; font-size: 20px; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .cpf-tag { color: #666; font-family: monospace; font-size: 12px; }

        @media print {
            .master-container { grid-template-columns: 1fr; padding: 0; }
            aside, .controls, .btn-math, .btn-action, .btn-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .user-node { border: 1px solid #000 !important; background: white !important; page-break-inside: avoid; }
            .security-card { box-shadow: none !important; border: 2px solid #000 !important; }
            .reward-points, #stats-display { color: black !important; text-shadow: none !important; }
        }
    </style>
</head>
<body>

<div class="master-container">
    <aside class="security-card">
        <h1>ELDIN I.A.</h1>
        <div style="font-size: 11px; color: var(--gold-glow); margin-bottom: 25px; letter-spacing: 1px;">SISTEMA DE PREMIAÇÃO</div>
        
        <nav>
            <button class="btn-action" onclick="addUser()">+ NOVO COLABORADOR</button>
            <button class="btn-print" onclick="window.print()">🖨️ GERAR RELATÓRIO A4</button>
            
            <div style="margin-top: 40px;">
                <p style="font-size: 14px;"><strong>INDICADORES KPI</strong></p>
                <div style="font-size: 11px; color: #888; line-height: 1.8;">
                    ⭐ 10 Pontos = R$ 1,00<br>
                    ❌ Falta = -R$ 50,00<br>
                    🏥 Atestado = Sem penalidade<br>
                    💯 100% Assiduidade = Bônus Extra
                </div>
            </div>
        </nav>
    </aside>

    <main>
        <div class="security-card" style="margin-bottom: 30px; position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 style="margin:0; font-size: 14px; color: #888;">CUSTO DE PRODUTIVIDADE (GLOBAL)</h2>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div id="stats-display" style="font-size: 48px; font-weight: 900; color: var(--golden-orange);">R$ 0,00</div>
                        <div style="display: flex; gap: 5px;">
                            <button class="btn-math" onclick="adjustGlobal(10)" style="background:var(--glass); border-radius:50%;">+</button>
                            <button class="btn-math" onclick="adjustGlobal(-10)" style="background:var(--glass); border-radius:50%;">-</button>
                            <button class="btn-math" onclick="resetGlobal()" style="color:var(--danger); margin-left:10px;">🔄</button>
                        </div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 12px; color: #666;">PONTUALIDADE MÉDIA</div>
                    <div id="media-kpi" class="reward-points" style="font-size: 32px;">0%</div>
                </div>
            </div>
        </div>

        <div class="user-grid" id="node-container"></div>
    </main>
</div>

<script>
    let globalOffset = 0; 
    let colaboradores = [
        { nome: "Cristian Ribeiro", cpf: "342.***.***-54", folgaFixa: "QUARTA", domingoMes: "2º Domingo", atestados: 5, faltas: 0, pontos: 1500 },
        { nome: "Mikaele Nascimento", cpf: "040.***.***-02", folgaFixa: "SEXTA", domingoMes: "1º Domingo", atestados: 2, faltas: 2, pontos: 2800 }
    ];

    function renderSystem() {
        const container = document.getElementById('node-container');
        let totalBônusSomado = 0;
        let somaPontualidade = 0;

        container.innerHTML = colaboradores.map((c, index) => {
            const valorBase = c.pontos / 10;
            const penalidadeFaltas = c.faltas * 50;
            const bônusCalculado = Math.max(0, valorBase - penalidadeFaltas);
            
            const assiduidade = Math.max(0, 100 - (c.faltas * 15));
            somaPontualidade += assiduidade;
            totalBônusSomado += bônusCalculado;

            return `
            <div class="user-node">
                <div style="display: flex; justify-content: space-between;">
                    <div>
                        <strong style="color:var(--gold-glow); font-size: 16px;">${c.nome.toUpperCase()}</strong><br>
                        <span class="cpf-tag">${c.cpf}</span>
                    </div>
                    <div class="reward-points">R$ ${bônusCalculado.toFixed(2)}</div>
                </div>

                <div style="margin: 15px 0;">
                    <div style="font-size: 10px; color: #888; margin-bottom: 5px;">ASSIDUIDADE: ${assiduidade}%</div>
                    <div style="width: 100%; height: 4px; background: #333; border-radius: 2px;">
                        <div style="width: ${assiduidade}%; height: 100%; background: ${assiduidade > 80 ? 'var(--success)' : 'var(--golden-orange)'}; box-shadow: 0 0 10px ${assiduidade > 80 ? '#00FF7F' : '#FF8C00'};"></div>
                    </div>
                </div>

                <div style="display: flex; gap: 8px;">
                    <div class="stat-badge">FOLGA: ${c.folgaFixa}</div>
                    <div class="stat-badge">DOMINGO: ${c.domingoMes}</div>
                </div>
                
                <div style="margin-top:20px; font-size: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="counter-group">
                        <button class="btn-math" onclick="adjustStat(${index}, 'atestados', -1)">-</button>
                        <span style="flex:1; text-align:center;">🏥 Atestados: <strong>${c.atestados}</strong></span>
                        <button class="btn-math" onclick="adjustStat(${index}, 'atestados', 1)">+</button>
                    </div>
                    <div class="counter-group">
                        <button class="btn-math" onclick="adjustStat(${index}, 'faltas', -1)">-</button>
                        <span style="flex:1; text-align:center;">❌ Faltas: <strong>${c.faltas}</strong></span>
                        <button class="btn-math" onclick="adjustStat(${index}, 'faltas', 1)">+</button>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-small" style="grid-column: span 2; border-color: var(--success); color: var(--success);" onclick="addKpi(${index})">⭐ CREDITAR ENTREGA</button>
                    <button class="btn-small" onclick="changeFolga(${index})">Trocar Folga</button>
                    <button class="btn-small" onclick="changeDomingo(${index})">Trocar Domingo</button>
                    <button class="btn-small" style="grid-column: span 2; border-color: var(--danger); color: var(--danger); margin-top: 5px;" onclick="removeUser(${index})">REMOVER COLABORADOR</button>
                </div>
            </div>
            `;
        }).join('');

        document.getElementById('stats-display').innerText = `R$ ${(totalBônusSomado + globalOffset).toFixed(2)}`;
        document.getElementById('media-kpi').innerText = `${(somaPontualidade / colaboradores.length).toFixed(0)}%`;
    }

    function adjustGlobal(val) { globalOffset += val; renderSystem(); }
    function resetGlobal() { globalOffset = 0; renderSystem(); }

    function addKpi(index) {
        const pts = prompt("Pontos de performance:", "100");
        if(pts && !isNaN(pts)) { colaboradores[index].pontos += parseInt(pts); renderSystem(); }
    }

    function adjustStat(index, field, value) {
        colaboradores[index][field] = Math.max(0, colaboradores[index][field] + value);
        renderSystem();
    }

    function addUser() {
        const n = prompt("Nome:");
        const c = prompt("CPF:");
        if(n && c) {
            colaboradores.push({ nome: n, cpf: c, folgaFixa: "A DEFINIR", domingoMes: "1º Domingo", atestados: 0, faltas: 0, pontos: 0 });
            renderSystem();
        }
    }

    function removeUser(index) {
        if(confirm(`Excluir ${colaboradores[index].nome}?`)) { colaboradores.splice(index, 1); renderSystem(); }
    }

    function changeFolga(index) {
        const nova = prompt("Nova Folga Fixa:", colaboradores[index].folgaFixa);
        if(nova) { colaboradores[index].folgaFixa = nova.toUpperCase(); renderSystem(); }
    }

    function changeDomingo(index) {
        const novo = prompt("Qual o Domingo do mês?", colaboradores[index].domingoMes);
        if(novo) { colaboradores[index].domingoMes = novo; renderSystem(); }
    }

    renderSystem();
</script>
</body>
</html>
